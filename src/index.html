<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Live Preview</title>
<link rel="stylesheet" href="./editor.css">
<body>
  <main id="preview" class="preview" aria-label="Markdown Live Preview" tabindex="-1"></main>
  <aside class="md-status">
    <span id="status" role="status">Opening document…</span>
    <button id="draft" type="button" hidden>Save draft as…</button>
  </aside>
  <script src="./editor.js" defer></script>
</body>
</html>

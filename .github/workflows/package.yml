name: Plugin package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Test and build
        run: |
          rustup toolchain install 1.100.0 --profile minimal --target wasm32-wasip2
          export RUSTUP_TOOLCHAIN=1.100.0
          npm ci
          npm test
          cargo test --locked --manifest-path native/Cargo.toml
          npm run build

      - name: Check package with OpenIDEA
        run: |
          archive="$RUNNER_TEMP/openidea-plugin.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            https://github.com/l0ng-ai/openidea/releases/download/v0.1.47/openidea-plugin-linux-x86_64.gz
          printf '%s  %s\n' 9394f2f4a892227f3ab17e8883e8deb340e8a6a8e9d8b61d7a9971ba51b70d1e "$archive" | sha256sum --check
          gunzip -c "$archive" > "$RUNNER_TEMP/openidea-plugin"
          chmod +x "$RUNNER_TEMP/openidea-plugin"
          version="$(node -p "require('./package.json').version")"
          "$RUNNER_TEMP/openidea-plugin" check "dist/markdown-live-preview-$version.oiplugin"

      - name: Sign package
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          OPENIDEA_SIGNING_KEY: ${{ secrets.OPENIDEA_SIGNING_KEY }}
        run: |
          test -n "$OPENIDEA_SIGNING_KEY"
          umask 077
          key="$(mktemp "$RUNNER_TEMP/openidea-key.XXXXXX")"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$OPENIDEA_SIGNING_KEY" > "$key"
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist/release
          package="memitsuk.markdown-live-preview-$version.oiplugin"
          "$RUNNER_TEMP/openidea-plugin" pack dist/plugin --key "$key" --publisher memitsuk --out "dist/release/$package"
          "$RUNNER_TEMP/openidea-plugin" check "dist/release/$package"
          (cd dist/release && sha256sum "$package" > "$package.sha256")

      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          name: signed-plugin
          path: dist/release/
          if-no-files-found: error
